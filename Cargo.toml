[workspace]
members = [
    "rust",
    "vendor/ifc-lite/rust/core",
    "vendor/ifc-lite/rust/engine",
    "vendor/ifc-lite/rust/geometry",
    "vendor/ifc-lite/rust/processing",
]
resolver = "2"

[workspace.package]
version = "4.1.0"
edition = "2021"
authors = ["IFC-Lite Contributors"]
license = "MPL-2.0"
repository = "https://github.com/louistrue/ifc-lite"

[workspace.dependencies]
ifc-lite-core = { version = "4.1.0", path = "vendor/ifc-lite/rust/core" }
ifc-lite-engine = { version = "4.1.0", path = "vendor/ifc-lite/rust/engine" }
ifc-lite-geometry = { version = "4.1.0", path = "vendor/ifc-lite/rust/geometry" }
ifc-lite-processing = { version = "4.1.0", path = "vendor/ifc-lite/rust/processing" }

# Numeric-safety policy, inherited by every member via `[lints] workspace = true`.
[workspace.lints.clippy]
excessive_precision = "allow"
manual_range_contains = "allow"
manual_clamp = "allow"
neg_cmp_op_on_partial_ord = "allow"
approx_constant = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
